# PRODUCTION = MAIN ONLY. Runs only on push to main (or tags). Never on refinement.
# To update talkweb.io: merge refinement → main, then push main. Do not deploy refinement to Production.
name: Deploy to Production

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Clear npm cache
      run: npm cache clean --force
      
    - name: Install dependencies
      run: |
        if [ -f package-lock.json ]; then
          npm ci --prefer-offline --no-audit
        else
          npm install --prefer-offline --no-audit
        fi
      
    - name: Validate database migrations
      run: |
        echo "🔍 Validating database migrations for production..."
        if [ -d "supabase/migrations" ]; then
          for migration in supabase/migrations/*.sql; do
            if [ -f "$migration" ]; then
              echo "Validating: $migration"
              node scripts/database/schema-validator.js validate "$migration"
              
              # Fail on critical issues
              if node scripts/database/schema-validator.js validate "$migration" | grep -q '"severity": "critical"'; then
                echo "❌ Critical issues found in migration: $migration"
                exit 1
              fi
            fi
          done
        fi
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      continue-on-error: true

    - name: Create production backup
      run: |
        echo "💾 Creating pre-deployment backup..."
        node scripts/database/migration-manager.js backup "production_pre_deploy_$(date +%Y%m%d_%H%M%S)"
        node scripts/database/schema-validator.js snapshot "production_pre_deploy_$(date +%Y%m%d_%H%M%S)"
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      continue-on-error: true

    - name: Build project
      run: npm run build
      env:
        NODE_ENV: production
        VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        
    - name: Run tests
      run: npm test
      continue-on-error: true

    - name: Deploy to Vercel Production
      uses: amondnet/vercel-action@v25
      with:
        vercel-token: ${{ secrets.VERCEL_TOKEN }}
        github-token: ${{ secrets.GITHUB_TOKEN }}
        vercel-args: '--prod'
        vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
        vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
        working-directory: ./
        alias-domains: |
          talkweb.io
          www.talkweb.io

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Release ${{ github.ref }}
        draft: false
        prerelease: false
        body: |
          ## Changes in this Release
          - Automated deployment from main branch
          - See commit history for detailed changes
          
    - name: Notify team
      if: success()
      run: |
        echo "✅ Production deployment successful!"
        # Add notification logic here (Slack, Discord, email, etc.)

  deploy-supabase-functions:
    name: Deploy Supabase Edge Functions
    runs-on: ubuntu-latest
    needs: deploy-production

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Supabase CLI
      uses: supabase/setup-cli@v1
      with:
        version: latest

    - name: Deploy Edge Functions
      run: |
        supabase functions deploy send-quick-help \
          realtime-token \
          contact-redirect \
          whatsapp-redirect \
          get-available-slots \
          --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
      env:
        SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}