<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32" />
    <link rel="icon" type="image/png" href="/favicon-48.png" sizes="48x48" />

    <!-- ChatGPT Ads measurement pixel. Near the top of <head> so a conversion
         can't be lost while the rest of the page loads.

         The pixel id is public — it ships in the page either way — so it is
         baked in rather than left as deploy configuration to forget. Set
         VITE_OPENAI_PIXEL_ID to point a build at a different data source.

         Skipped on localhost and *.vercel.app, so development and preview
         deployments never pollute the live numbers. The rule fails OPEN on
         any other host: a production domain we have not thought of should
         start measuring, not silently stop.

         Deliberately skipped on /h/… and /app/… — a guest in their room and a
         member of staff at work are product, not ad traffic, and an ad
         network has no business setting cookies on a hotel guest's phone. -->
    <script>
      (function (w, d, s, u) {
        var id = "%VITE_OPENAI_PIXEL_ID%";
        if (!id || id.charAt(0) === "%") id = "Dhsy3hdFeDnqs1YL9ABhtW";
        var h = d.location.hostname;
        if (h === "localhost" || h === "127.0.0.1" || /\.vercel\.app$/.test(h)) return;
        if (/^\/(h|app)(\/|$)/.test(d.location.pathname)) return;
        if (w.oaiq) return;
        var q = function () {
          q.q.push(arguments);
        };
        q.q = [];
        w.oaiq = q;
        var js = d.createElement(s);
        js.async = true;
        js.src = u;
        var f = d.getElementsByTagName(s)[0];
        f.parentNode.insertBefore(js, f);
        w.oaiq("init", { pixelId: id });
      })(window, document, "script", "https://bzrcdn.openai.com/sdk/oaiq.min.js");
    </script>

    <!-- PWA manifest is injected by vite-plugin-pwa (manifest.webmanifest). -->
    <meta name="theme-color" content="#7c3aed" />

    <!-- iOS PWA Support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="TalkStay" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" sizes="180x180" />

    <title>TalkStay by TalkWeb — Voice-first guest service for hotels & stays</title>
    <meta name="description" content="Voice-first guest service for hotels: guests scan the room QR or open a Room Assistant link from email, speak naturally, and requests are routed, tracked, and completed — from anywhere." />
    <meta name="author" content="TalkWeb" />

    <!-- Start LCP hero fetch before the JS bundle parses. -->
    <link
      rel="preload"
      as="image"
      type="image/webp"
      imagesrcset="/marketing/hero-720.webp 720w, /marketing/hero.webp 1215w"
      imagesizes="(min-width: 1024px) 45vw, min(100vw, 40rem)"
      href="/marketing/hero.webp"
      fetchpriority="high"
    />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="TalkStay by TalkWeb" />
    <meta property="og:description" content="The voice-first guest-service platform for hotels and serviced stays. Scan. Speak. Consider it done." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TalkStay by TalkWeb" />
    <meta name="twitter:description" content="The voice-first guest-service platform for hotels and serviced stays." />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
