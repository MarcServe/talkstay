<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32" />

    <!-- PWA manifest is injected by vite-plugin-pwa (manifest.webmanifest). -->
    <meta name="theme-color" content="#7c3aed" />

    <!-- iOS PWA Support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="TalkStay" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" sizes="180x180" />

    <title>TalkStay by TalkWeb — Voice-first guest service for hotels & stays</title>
    <meta name="description" content="Guests scan a room QR code and speak naturally to request room service, housekeeping, laundry, maintenance or front-desk help. Every request is routed, tracked and reviewed. Scan. Speak. Consider it done." />
    <meta name="author" content="TalkWeb" />

    <!-- Start LCP hero fetch before the JS bundle parses. -->
    <link
      rel="preload"
      as="image"
      type="image/webp"
      imagesrcset="/marketing/hero-720.webp 720w, /marketing/hero.webp 1388w"
      imagesizes="(min-width: 1024px) 45vw, min(100vw, 40rem)"
      href="/marketing/hero.webp"
      fetchpriority="high"
    />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="TalkStay by TalkWeb" />
    <meta property="og:description" content="The voice-first guest-service platform for hotels and serviced stays. Scan. Speak. Consider it done." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TalkStay by TalkWeb" />
    <meta name="twitter:description" content="The voice-first guest-service platform for hotels and serviced stays." />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
